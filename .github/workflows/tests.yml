name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unittest:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # The version the drift pipeline itself runs on
          # (drift-check-lz-hybrid.yml). Testing the deployed runtime beats
          # testing a matrix: a failure on a version nothing runs is noise.
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # stdlib unittest, no test dependencies (a CLAUDE.md non-negotiable).
        # The suite is fully mocked - no Azure credentials, no network, no
        # AZURE_SUBSCRIPTION_ID - so there is nothing to configure here.
        run: python -m unittest discover -s tests
