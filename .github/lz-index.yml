# Landing Zone Index
#
# This file maps Landing Zones to their configuration files in external Bicep repos.
# Each team manages their own LZ config in their Bicep repository.
#
# To add a new landing zone:
# 1. Copy .github/workflows/drift-lz-template.yml to drift-lz-<TEAM_NAME>.yml
# 2. Update the schedule, landing_zone parameter, and workflow name
# 3. Add an entry below in this file
#
# Format:
#   landing_zones:
#     lz-name:
#       repo: org/repo-name                          # GitHub repo with Bicep
#       config_path: .github/drift-lz-config.yml     # Path to LZ config in that repo
#       schedule: '0 9 * * *'                        # Cron: when to run (UTC)
#       workflow: drift-lz-lz-name.yml               # Workflow file to run

landing_zones:
  # ===================== PRODUCTION LANDING ZONES =====================
  # The real landing-zone templates - what this agent exists to scan. They are
  # NOT standing estates: verified 2026-08-23, the prod estate was found torn
  # down and had to be redeployed from envs/prod before it could be scanned or
  # recorded at all. Like the fixtures below, they are stood up for a round and
  # torn down after; what separates the two sections is what the estate
  # REPRESENTS, not how long it lives. So a failing scan here, as there, more
  # often means the estate is absent than that drift was found.
  # In THIS repository they are the maintainer's own demonstration estates -
  # which is why a cassette recorded from one is safe to commit (see
  # docs/SECURITY.md, "Recorded Payloads"). In a fork this section is where
  # real customer infrastructure goes, so treat anything recorded from it as
  # client data unless you know otherwise.

  landingzone:
    repo: jaxywaxy/azure-landingzone-bicep
    config_path: .github/drift-lz-config.yml
    workflow: drift-lz-landingzone.yml

  # The PROD platform LZ, in a different subscription to `landingzone` (which is
  # dev). Same repo and template lineage, separate estate - the two must not be
  # pointed at each other's subscription, since each template declares its own
  # prefix and would read the other estate as entirely missing plus entirely
  # extra.
  landingzone-prod:
    repo: jaxywaxy/azure-landingzone-bicep
    config_path: .github/drift-lz-prod-config.yml
    workflow: drift-lz-prod.yml

  # ======================= VERIFICATION ONLY ==========================
  # Fixture estates used to promote a capability from live-clean to
  # live-proven (see docs/TEST_ESTATE.md). NOT customer infrastructure:
  # they are deployed for a round and torn down after, so a failing scan
  # here usually means the estate is absent, not that drift was found.
  #
  # Manual dispatch only. Do not add a schedule to any of them - a
  # scheduled scan of a normally-absent estate produces a daily failure
  # that trains people to ignore red.

  test-resources:
    repo: jaxywaxy/drift-test-resources
    config_path: .github/drift-lz-config.yml
    workflow: drift-lz-test.yml
